spring.application.name=demo
app.bootstrap-admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=${APP_JWT_EXPIRATION:PT8H}
app.jwt.secure-cookie=${APP_JWT_SECURE_COOKIE:false}
app.decolecta.token=${DECOLECTA_API_TOKEN:}
app.company.encryption-key=${APP_COMPANY_ENCRYPTION_KEY}
